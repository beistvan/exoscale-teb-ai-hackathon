[package]
name = "greenops-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Experimental Rust port of the GreenOps live controller (scripts/greenops), parity-first"
publish = false

[[bin]]
name = "greenops-controller"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
hmac = "0.12"
indexmap = { version = "2", features = ["serde"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
